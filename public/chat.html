<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Messenger · Jay Video Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0b0b14;
            color: #eee;
            min-height: 100vh;
            padding: 0.8rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .glass-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.7rem 1rem;
            padding: 0.6rem 1.2rem;
            margin-bottom: 1.2rem;
            border-radius: 40px;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo i {
            color: #6c5ce7;
        }
        .nav-menu {
            display: flex;
            gap: 0.5rem;
            font-weight: 400;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }
        .nav-menu a {
            text-decoration: none;
            color: inherit;
            opacity: 0.7;
            transition: 0.2s;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .nav-menu a:hover {
            opacity: 1;
            background: rgba(255,255,255,0.05);
        }
        .nav-menu a.active {
            opacity: 1;
            color: #0084ff;
            background: rgba(0,132,255,0.2);
        }

        /* Chat Container */
        .chat-wrapper {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            height: 80vh;
        }
        .chat-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* Footer */
        .glass-footer {
            padding: 0.8rem 1.4rem;
            border-radius: 40px;
            margin-top: 1.2rem;
            background: rgba(20, 20, 30, 0.5);
            backdrop-filter: blur(6px);
        }
        .footer-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.8rem;
        }
        .social-icons a,
        .contact-links a {
            color: inherit;
            margin: 0 4px;
            opacity: 0.6;
            transition: 0.2s;
            text-decoration: none;
        }
        .social-icons a:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            body {
                padding: 0.4rem;
            }
            .glass-header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
                padding: 0.6rem 1rem;
                border-radius: 28px;
            }
            .nav-menu {
                justify-content: center;
                font-size: 0.75rem;
                gap: 0.4rem;
            }
            .nav-menu a {
                padding: 3px 8px;
            }
            .chat-wrapper {
                height: 75vh;
            }
            .glass-footer {
                padding: 0.6rem 1rem;
            }
            .footer-content {
                font-size: 0.7rem;
                justify-content: center;
                gap: 0.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="glass-header">
            <div class="logo"><i class="fas fa-play-circle"></i>Jay Player</div>
            <nav class="nav-menu">
                <a href="/">Home</a>
                <a href="/chat.html" class="active">💬 Messenger</a>
                
            </nav>
            <div style="flex:1;min-width:80px;"></div>
            <div class="user-profile"><i class="fas fa-user-circle"></i></div>
        </header>

        <!-- Chat -->
        <div class="chat-wrapper">
            <iframe 
                src="https://realtimechatapi-f2pf.onrender.com" 
                allow="microphone; camera; autoplay; encrypted-media;"
                loading="lazy"
                title="Messenger Chat"
                sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
            ></iframe>
        </div>

        <!-- Footer -->
        <footer class="glass-footer">
            <div class="footer-content">
                <span>© <span id="copyrightYear">2026</span> JayBohol</span>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-github"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-youtube"></i></a>
                </div>
                <div class="contact-links">
                    <a href="mailto:jaybohol@example.com">contact</a> · 
                    <a href="#">privacy</a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        document.getElementById('copyrightYear').textContent = new Date().getFullYear();
    </script>
</body>
</html>
