<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Jay Video Hub · social player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0b0b14;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 0.8rem;
        }
        #app {
            max-width: 1440px;
            width: 100%;
        }

        /* ---------- LOADING ---------- */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #0b0b14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.8s;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #2a2a3a;
            border-top: 5px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loading-screen p {
            margin-top: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #aaa;
        }

        /* ---------- GLASS ---------- */
        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .hidden {
            display: none !important;
        }

        /* ---------- HEADER ---------- */
        .glass-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.7rem 1rem;
            padding: 0.6rem 1.2rem;
            margin-bottom: 1.2rem;
            border-radius: 40px;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo i {
            color: #6c5ce7;
        }
        .nav-menu {
            display: flex;
            gap: 1rem;
            font-weight: 400;
            font-size: 0.9rem;
        }
        .nav-menu a {
            text-decoration: none;
            color: inherit;
            opacity: 0.7;
            transition: 0.2s;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .nav-menu a:hover {
            opacity: 1;
            background: rgba(255,255,255,0.05);
        }
        .nav-menu a.active {
            opacity: 1;
            color: #6c5ce7;
            background: rgba(108,92,231,0.15);
        }
        .search-wrapper {
            flex: 1;
            min-width: 120px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-wrapper input {
            width: 100%;
            padding: 0.4rem 0.8rem 0.4rem 2.2rem;
            border-radius: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #eee;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            outline: none;
        }
        .search-wrapper i {
            position: absolute;
            left: 12px;
            opacity: 0.5;
            font-size: 0.9rem;
        }
        .user-profile {
            font-size: 1.6rem;
            opacity: 0.8;
            cursor: pointer;
        }

        /* ---------- MAIN GRID ---------- */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1.2rem;
            margin-bottom: 1.2rem;
        }
        @media (max-width: 860px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }

        /* ---------- VIDEO PLAYER ---------- */
        .player-wrapper {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            background: #0a0a14;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            min-height: 300px;
        }
        .player-wrapper video {
            width: 100%;
            display: block;
            aspect-ratio: 9 / 16;
            background: #0a0a14;
            object-fit: contain;
            max-height: 80vh;
        }
        .player-wrapper .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 1.2rem;
            gap: 1rem;
            background: #0a0a14;
        }
        .player-wrapper .video-placeholder i {
            font-size: 4rem;
            color: #6c5ce7;
            opacity: 0.5;
        }
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 12px 10px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
        }
        .progress-bar-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .progress-slider {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            outline: none;
        }
        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6c5ce7;
            cursor: pointer;
        }
        .progress-time {
            display: flex;
            gap: 8px;
            font-size: 0.7rem;
            opacity: 0.8;
            white-space: nowrap;
        }
        .controls-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 10px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 30px;
            opacity: 0.8;
        }
        .ctrl-btn:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.08);
        }
        .volume-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .volume-group input[type="range"] {
            width: 60px;
            height: 3px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        .volume-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #6c5ce7;
        }
        .speed-group select {
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: none;
            padding: 2px 8px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.7rem;
            cursor: pointer;
        }

        /* ---------- VIDEO INFO ---------- */
        .video-info {
            padding: 1rem 1.4rem;
            margin-top: 1rem;
        }
        .video-info h2 {
            font-weight: 600;
            font-size: 1.3rem;
            word-break: break-word;
        }
        .meta-row {
            opacity: 0.6;
            font-size: 0.8rem;
            margin: 4px 0 8px;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            margin-top: 10px;
            align-items: center;
        }
        .action-bar button,
        .upload-label {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            padding: 5px 14px;
            border-radius: 40px;
            color: inherit;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .action-bar button:hover,
        .upload-label:hover {
            background: rgba(108, 92, 231, 0.2);
        }
        .upload-label input {
            display: none;
        }

        /* ---------- PLAYLIST SIDEBAR ---------- */
        .playlist-sidebar {
            padding: 1rem 0.8rem;
            max-height: 600px;
            overflow-y: auto;
        }
        .playlist-sidebar h3 {
            margin-bottom: 0.8rem;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 1.1rem;
        }
        .playlist-item {
            display: flex;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 6px;
            align-items: center;
        }
        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .playlist-item.active {
            background: rgba(108, 92, 231, 0.25);
            border-left: 4px solid #6c5ce7;
        }
        .playlist-item .pl-info {
            flex: 1;
            min-width: 0;
        }
        .playlist-item .pl-info .pl-title {
            font-weight: 500;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item .pl-info .pl-duration {
            font-size: 0.7rem;
            opacity: 0.5;
        }

        /* ---------- CHAT SECTION ---------- */
        .chat-iframe-container {
            width: 100%;
            height: 500px;
            border-radius: 16px;
            overflow: hidden;
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .chat-iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #1a1a2e;
        }
        .chat-sidebar {
            padding: 1rem 0.8rem;
        }
        .chat-sidebar h3 {
            margin-bottom: 0.8rem;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 1.1rem;
        }

        /* ---------- FOOTER ---------- */
        .glass-footer {
            padding: 0.8rem 1.4rem;
            border-radius: 40px;
            margin-top: 1.2rem;
            background: rgba(20, 20, 30, 0.5);
            backdrop-filter: blur(6px);
        }
        .footer-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.8rem;
        }
        .social-icons a,
        .contact-links a {
            color: inherit;
            margin: 0 4px;
            opacity: 0.6;
            transition: 0.2s;
            text-decoration: none;
        }
        .social-icons a:hover {
            opacity: 1;
        }

        /* ---------- TOAST ---------- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 999;
            max-width: 90%;
        }
        .toast {
            background: #1a1a2e;
            color: #eee;
            padding: 10px 20px;
            border-radius: 40px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border-left: 4px solid #6c5ce7;
            animation: slideIn 0.4s ease;
            font-weight: 400;
            font-size: 0.9rem;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ---------- SCROLLBAR ---------- */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #6c5ce7;
            border-radius: 10px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 640px) {
            body {
                padding: 0.4rem;
            }
            .glass-header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
                padding: 0.6rem 1rem;
                border-radius: 28px;
            }
            .nav-menu {
                justify-content: center;
                font-size: 0.8rem;
                gap: 0.8rem;
            }
            .search-wrapper {
                min-width: 100px;
            }
            .controls-row {
                gap: 4px 6px;
            }
            .volume-group input[type="range"] {
                width: 44px;
            }
            .ctrl-btn {
                font-size: 0.85rem;
                padding: 2px 4px;
            }
            .video-info h2 {
                font-size: 1.1rem;
            }
            .action-bar button,
            .upload-label {
                font-size: 0.75rem;
                padding: 4px 10px;
            }
            .playlist-item .pl-info .pl-title {
                font-size: 0.8rem;
            }
            .chat-iframe-container {
                height: 400px;
            }
            .glass-footer {
                padding: 0.6rem 1rem;
            }
            .footer-content {
                font-size: 0.7rem;
                justify-content: center;
                gap: 0.4rem;
            }
        }
        @media (max-width: 480px) {
            .chat-iframe-container {
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <!-- loading -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p>loading …</p>
    </div>

    <div id="app" class="hidden">
        <!-- header -->
        <header class="glass-header">
            <div class="logo"><i class="fas fa-play-circle"></i>Jay Player</div>
            <nav class="nav-menu">
                <a href="/" class="active">Home</a>
                <a href="/rename.html">Manage Files</a>
                <a href="/admin.html">Admin</a>
            </nav>
            <div class="search-wrapper"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search videos..." /></div>
            <div class="user-profile"><i class="fas fa-user-circle"></i></div>
        </header>

        <!-- Main Content -->
        <div class="main-grid">
            <!-- Video Section -->
            <section class="video-section">
                <div class="player-wrapper" id="playerWrapper">
                    <video id="videoPlayer" preload="metadata" crossorigin="anonymous"></video>
                    <div class="video-placeholder" id="videoPlaceholder">
                        <i class="fas fa-play-circle"></i>
                        <span>Select a video to play</span>
                    </div>
                    <div class="custom-controls" id="customControls">
                        <div class="progress-bar-container">
                            <input type="range" class="progress-slider" id="progressSlider" value="0" min="0" max="100" step="0.1" />
                            <div class="progress-time"><span id="currentTime">0:00</span><span id="totalDuration">0:00</span></div>
                        </div>
                        <div class="controls-row">
                            <button id="playPauseBtn" class="ctrl-btn"><i class="fas fa-play"></i></button>
                            <button id="skipBackBtn" class="ctrl-btn"><i class="fas fa-backward"></i> 10</button>
                            <button id="skipForwardBtn" class="ctrl-btn"><i class="fas fa-forward"></i> 10</button>
                            <div class="volume-group">
                                <button id="muteBtn" class="ctrl-btn"><i class="fas fa-volume-up"></i></button>
                                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" />
                            </div>
                            <div class="speed-group">
                                <select id="playbackSpeed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
                            </div>
                            <button id="theaterBtn" class="ctrl-btn"><i class="fas fa-expand-alt"></i></button>
                            <button id="fullscreenBtn" class="ctrl-btn"><i class="fas fa-expand"></i></button>
                        </div>
                    </div>
                </div>

                <div class="video-info glass">
                    <h2 id="videoTitle">Select a video</h2>
                    <div class="meta-row"><span id="viewCount">0 views</span> · <span id="uploadDate">today</span></div>
                    <p id="videoDesc">Click a video from the playlist to start watching</p>
                    <div class="action-bar">
                        <button id="likeBtn"><i class="far fa-thumbs-up"></i> <span id="likeCount">0</span></button>
                        <button id="dislikeBtn"><i class="far fa-thumbs-down"></i> <span id="dislikeCount">0</span></button>
                        <button id="shareBtn"><i class="fas fa-share-alt"></i> Share</button>
                        <button id="saveBtn"><i class="far fa-bookmark"></i> Save</button>
                        <label class="upload-label"><i class="fas fa-upload"></i> Upload<input type="file" id="fileUpload" accept="video/*" /></label>
                    </div>
                </div>
            </section>

            <!-- Playlist Sidebar -->
            <aside class="playlist-sidebar glass">
                <h3><i class="fas fa-list-ul"></i> Playlist</h3>
                <div id="playlistContainer" class="playlist-container"></div>
            </aside>
        </div>

        <!-- Chat Section - Using the external API -->
        <div class="main-grid" style="margin-top: 1.2rem;">
            <div class="chat-sidebar glass" style="grid-column: 1 / -1;">
                <h3><i class="fas fa-comment-dots"></i> Live Chat</h3>
                <div class="chat-iframe-container">
                    <iframe 
                        src="https://realtimechatapi-f2pf.onrender.com" 
                        allow="microphone; camera; autoplay; encrypted-media;"
                        loading="lazy"
                        title="Messenger Chat"
                        sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
                    ></iframe>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="glass-footer">
            <div class="footer-content">
                <span>© <span id="copyrightYear">2026</span> JayBohol</span>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-github"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-youtube"></i></a>
                </div>
                <div class="contact-links">
                    <a href="mailto:jaybohol@example.com">contact</a> · 
                    <a href="#">privacy</a>
                </div>
            </div>
        </footer>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        // ============================================
        // DOM REFS
        // ============================================
        const app = document.getElementById('app');
        const loading = document.getElementById('loading-screen');
        const video = document.getElementById('videoPlayer');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const playBtn = document.getElementById('playPauseBtn');
        const skipBack = document.getElementById('skipBackBtn');
        const skipForward = document.getElementById('skipForwardBtn');
        const progressSlider = document.getElementById('progressSlider');
        const currentTimeSpan = document.getElementById('currentTime');
        const durationSpan = document.getElementById('totalDuration');
        const volumeSlider = document.getElementById('volumeSlider');
        const muteBtn = document.getElementById('muteBtn');
        const speedSelect = document.getElementById('playbackSpeed');
        const theaterBtn = document.getElementById('theaterBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const videoTitle = document.getElementById('videoTitle');
        const viewCount = document.getElementById('viewCount');
        const uploadDate = document.getElementById('uploadDate');
        const videoDesc = document.getElementById('videoDesc');
        const likeBtn = document.getElementById('likeBtn');
        const likeCount = document.getElementById('likeCount');
        const dislikeBtn = document.getElementById('dislikeBtn');
        const dislikeCount = document.getElementById('dislikeCount');
        const shareBtn = document.getElementById('shareBtn');
        const saveBtn = document.getElementById('saveBtn');
        const fileUpload = document.getElementById('fileUpload');
        const searchInput = document.getElementById('searchInput');
        const playlistContainer = document.getElementById('playlistContainer');
        const toastContainer = document.getElementById('toastContainer');
        const playerWrapper = document.getElementById('playerWrapper');
        const copyrightYear = document.getElementById('copyrightYear');

        // ============================================
        // CONFIGURATION
        // ============================================
        const API_BASE = 'https://jay-so2u.onrender.com';
        const API_STREAM = `${API_BASE}/stream`;
        const API_FILES = `${API_BASE}/files`;

        let currentVideoIndex = 0;
        let playlist = [];

        // ============================================
        // HELPERS
        // ============================================
        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            toastContainer.appendChild(t);
            setTimeout(() => { t.remove(); }, 3000);
        }

        function formatFileSize(bytes) {
            if (!bytes) return '';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);
            return `hsl(${hue}, 60%, 25%)`;
        }

        function getVideoTitle(filename) {
            let name = filename.replace(/\.[^/.]+$/, '');
            name = name.replace(/[_-]/g, ' ');
            name = name.split(' ').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
            ).join(' ');
            return name || 'Untitled Video';
        }

        // ============================================
        // LOAD FILES
        // ============================================
        async function loadFiles() {
            try {
                const response = await fetch(API_FILES);
                if (!response.ok) {
                    throw new Error('Failed to fetch files');
                }
                const data = await response.json();
                
                if (data.success && data.files) {
                    playlist = data.files.map(file => ({
                        id: file.id,
                        title: getVideoTitle(file.filename),
                        filename: file.filename,
                        src: `${API_STREAM}/${file.id}.mp4`,
                        duration: '0:00',
                        views: 0,
                        date: file.uploadDate ? new Date(file.uploadDate).toISOString().slice(0, 10) : 'today',
                        desc: `Video: ${file.filename}`,
                        fileSize: file.fileSize || 0
                    }));
                    
                    if (playlist.length > 0) {
                        loadVideo(0);
                    }
                    renderPlaylist();
                    showToast(`Loaded ${playlist.length} videos`);
                }
            } catch (error) {
                console.error('Error loading files:', error);
                showToast('Could not load files from server');
            }
        }

        // ============================================
        // VIDEO FUNCTIONS
        // ============================================
        function loadVideo(index) {
            if (index < 0 || index >= playlist.length) {
                videoPlaceholder.classList.remove('hidden');
                video.classList.add('hidden');
                videoTitle.textContent = 'No videos available';
                videoDesc.textContent = 'Upload a video to get started';
                return;
            }
            currentVideoIndex = index;
            const v = playlist[index];

            videoPlaceholder.classList.add('hidden');
            video.classList.remove('hidden');

            video.src = v.src;
            video.load();

            videoTitle.textContent = v.title;
            viewCount.textContent = v.views + ' views';
            uploadDate.textContent = v.date || 'today';
            videoDesc.textContent = v.desc || 'no description';

            document.querySelectorAll('.playlist-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            if (v.duration && v.duration !== '0:00') {
                durationSpan.textContent = v.duration;
            } else {
                durationSpan.textContent = '0:00';
            }
        }

        function renderPlaylist(filter = '') {
            const filtered = playlist.filter(v => v.title.toLowerCase().includes(filter.toLowerCase()));
            playlistContainer.innerHTML = '';
            if (filtered.length === 0) {
                playlistContainer.innerHTML = `
                    <div style="text-align:center;padding:20px;color:#666;font-size:0.9rem;">
                        <i class="fas fa-video" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
                        ${playlist.length === 0 ? 'No videos uploaded yet.<br>Upload a video to get started!' : 'No matching videos'}
                    </div>
                `;
                return;
            }
            filtered.forEach((v, idx) => {
                const originalIdx = playlist.indexOf(v);
                const div = document.createElement('div');
                div.className = 'playlist-item' + (originalIdx === currentVideoIndex ? ' active' : '');
                const color = stringToColor(v.title);
                div.innerHTML = `
                    <div style="width:64px;height:44px;border-radius:12px;background:${color};display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">
                        <i class="fas fa-play" style="color:rgba(255,255,255,0.7);"></i>
                    </div>
                    <div class="pl-info"><div class="pl-title">${v.title}</div><div class="pl-duration">${v.duration || '0:00'} ${v.fileSize ? '· ' + formatFileSize(v.fileSize) : ''}</div></div>
                `;
                div.addEventListener('click', () => { loadVideo(originalIdx); });
                playlistContainer.appendChild(div);
            });
        }

        // ============================================
        // VIDEO CONTROLS
        // ============================================
        function togglePlay() {
            if (video.paused) {
                video.play().catch(e => showToast('Error playing video'));
            } else {
                video.pause();
            }
        }

        function updatePlayButton() {
            const icon = playBtn.querySelector('i');
            if (video.paused) {
                icon.className = 'fas fa-play';
            } else {
                icon.className = 'fas fa-pause';
            }
        }

        function updateProgress() {
            if (video.duration && isFinite(video.duration)) {
                const pct = (video.currentTime / video.duration) * 100;
                progressSlider.value = pct;
                currentTimeSpan.textContent = formatTime(video.currentTime);
                durationSpan.textContent = formatTime(video.duration);
                if (playlist[currentVideoIndex] && playlist[currentVideoIndex].duration === '0:00' && video.duration) {
                    playlist[currentVideoIndex].duration = formatTime(video.duration);
                    renderPlaylist(searchInput.value);
                }
            }
        }

        // ============================================
        // UPLOAD
        // ============================================
        async function uploadVideoToServer(file) {
            try {
                const formData = new FormData();
                formData.append('file', file);

                showToast('Uploading...');
                
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Upload failed: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    showToast('Upload successful!');
                    
                    const newVideo = {
                        id: data.fileId,
                        title: file.name.replace(/\.[^/.]+$/, ''),
                        filename: file.name,
                        src: `${API_STREAM}/${data.fileId}.mp4`,
                        duration: '0:00',
                        views: 0,
                        date: new Date().toISOString().slice(0, 10),
                        desc: 'uploaded video',
                        fileSize: file.size
                    };
                    playlist.push(newVideo);
                    renderPlaylist(searchInput.value);
                    loadVideo(playlist.length - 1);
                    return true;
                } else {
                    showToast('Upload failed: ' + (data.message || 'Unknown error'));
                    return false;
                }
            } catch (error) {
                console.error('Upload error:', error);
                showToast('Upload error: ' + error.message);
                return false;
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        playBtn.addEventListener('click', togglePlay);
        video.addEventListener('play', updatePlayButton);
        video.addEventListener('pause', updatePlayButton);
        video.addEventListener('timeupdate', updateProgress);

        video.addEventListener('loadedmetadata', () => {
            durationSpan.textContent = formatTime(video.duration);
            if (playlist[currentVideoIndex]) {
                playlist[currentVideoIndex].duration = formatTime(video.duration);
                renderPlaylist(searchInput.value);
            }
        });

        skipBack.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
        skipForward.addEventListener('click', () => { video.currentTime = Math.min(video.duration, video.currentTime + 10); });

        progressSlider.addEventListener('input', () => {
            if (video.duration && isFinite(video.duration)) {
                video.currentTime = (progressSlider.value / 100) * video.duration;
            }
        });

        volumeSlider.addEventListener('input', () => {
            video.volume = parseFloat(volumeSlider.value);
            video.muted = false;
            muteBtn.querySelector('i').className = video.volume > 0 ? 'fas fa-volume-up' : 'fas fa-volume-off';
        });
        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            muteBtn.querySelector('i').className = video.muted ? 'fas fa-volume-off' : 'fas fa-volume-up';
            if (!video.muted) volumeSlider.value = video.volume;
        });

        speedSelect.addEventListener('change', () => { video.playbackRate = parseFloat(speedSelect.value); });

        theaterBtn.addEventListener('click', () => {
            playerWrapper.style.maxWidth = playerWrapper.style.maxWidth === '100%' ? '100%' : '100%';
            playerWrapper.style.borderRadius = playerWrapper.style.borderRadius === '0' ? '28px' : '0';
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                playerWrapper.requestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        });

        fileUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('video/')) {
                const success = await uploadVideoToServer(file);
                if (success) fileUpload.value = '';
            } else {
                showToast('Please select a video file');
            }
        });

        searchInput.addEventListener('input', () => { renderPlaylist(searchInput.value); });

        likeBtn.addEventListener('click', () => showToast('Liked!'));
        dislikeBtn.addEventListener('click', () => showToast('Disliked!'));
        shareBtn.addEventListener('click', () => {
            const v = playlist[currentVideoIndex];
            if (v) {
                navigator.clipboard?.writeText(v.src).then(() => {
                    showToast('URL copied to clipboard!');
                }).catch(() => {
                    showToast('Share: ' + v.src);
                });
            }
        });
        saveBtn.addEventListener('click', () => showToast('Saved!'));

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            switch (e.key) {
                case ' ': e.preventDefault(); togglePlay(); break;
                case 'ArrowLeft': e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 5); break;
                case 'ArrowRight': e.preventDefault(); video.currentTime = Math.min(video.duration, video.currentTime + 5); break;
                case 'f': e.preventDefault(); fullscreenBtn.click(); break;
                case 'm': e.preventDefault(); muteBtn.click(); break;
            }
        });

        // ============================================
        // INIT
        // ============================================
        copyrightYear.textContent = new Date().getFullYear();

        async function init() {
            renderPlaylist();
            await loadFiles();
            setTimeout(() => {
                loading.classList.add('hidden');
                app.classList.remove('hidden');
            }, 600);
            video.controls = false;
        }

        init();
    </script>
</body>
    </html>
